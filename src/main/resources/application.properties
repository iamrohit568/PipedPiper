


spring.application.name=yt-scrapper
server.port=${PORT:8080}
youtube.api.key=${YOUTUBE_API_KEY}
youtube.api.url=https://www.googleapis.com/youtube/v3/videos
youtube.api.search.url=https://www.googleapis.com/youtube/v3/search
youtube.max.results=50

spring.datasource.url=jdbc:mysql://${MYSQL_HOSTNAME:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yt_scrapper}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}

# Production Settings
site.url=https://PipedPiper.ap-south-1.elasticbeanstalk.com
site.name=Piped Piper
server.forward-headers-strategy=native

# Proxy Settings (Optional - for bypassing YouTube blocks in production)
proxy.host=${PROXY_HOST:}
proxy.port=${PROXY_PORT:}
proxy.user=${PROXY_USER:}
proxy.password=${PROXY_PASSWORD:}

# Transcript API Settings (Permanent Fix for Production)
# Provider options: "local" (default) or "supadata"
transcript.api.provider=${TRANSCRIPT_API_PROVIDER:local}
transcript.api.key=${TRANSCRIPT_API_KEY:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:update}
spring.jpa.show-sql=${SHOW_SQL:true}

# Security
spring.security.filter.dispatcher-types=REQUEST,ERROR,ASYNC
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# AI Provider Configuration (groq or gemini)
ai.provider=groq
ai.temperature=0.3
ai.max.tokens=4096

# Groq API (recommended — free tier, works globally)
groq.api.key=${GROQ_API_KEY}
groq.model=llama-3.3-70b-versatile

# Gemini API (fallback — may have regional restrictions)
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.0-flash

# Transcript Feature Limits
transcript.max.video.duration.hours=3
transcript.rate.limit.per.minute=10
transcript.chat.rate.limit.per.minute=30